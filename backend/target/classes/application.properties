spring.application.name=crud-usuarios

# ---------------------------------------------------------
# Conexión a MySQL usando variables de entorno
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crud_usuarios}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del backend
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------
# Sesión (autenticación básica, sin JWT)
# ---------------------------------------------------------
# Tiempo de inactividad antes de que la sesión expire automáticamente
server.servlet.session.timeout=30m
# La cookie de sesión no se puede leer desde JavaScript (protege contra robo por XSS)
server.servlet.session.cookie.http-only=true
# "Lax" permite que la cookie viaje entre distintos puertos del mismo host (localhost:8081 -> localhost:8080)
server.servlet.session.cookie.same-site=lax

# Nota: FRONTEND_ORIGIN (usada en WebConfig para CORS) se lee directamente
# de la variable de entorno del sistema/Docker; si no está definida, WebConfig
# usa http://localhost:8081 por defecto.
